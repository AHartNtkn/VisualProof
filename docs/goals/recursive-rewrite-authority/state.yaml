version: 2

goal:
  title: "Recursive Rewrite Authority"
  slug: "recursive-rewrite-authority"
  kind: existing_plan
  tranche: "Move flat representation and execution behind the Concrete implementation boundary."
  status: active
  oracle:
    signal: "Kernel-checked Lean theorems prove one recursive relational calculus with structural semantics and a separate concrete refinement layer."
    cadence: "after each Worker package and at final audit"
    final_proof: "The Lean build passes; Step.sound is exhaustive and execution refinement is proved separately; the final receipt maps every requested property to kernel-checked declarations and records full_outcome_complete: true."
  intake:
    original_request: "Refactor to recursive relational rewriting with certified concrete refinement, using subagent-driven planning and execution under /goal."
    interpreted_outcome: "Recursive diagrams and relational Step own proof theory and semantics; concrete translation and execution are verified refinements only."
    input_shape: existing_plan
    audience: "VisualProofAssistant maintainers and proof-kernel users"
    authority: requested
    proof_type: test
    completion_proof: "The Lean build passes with complete definitions and kernel-checked abstract soundness and concrete refinement theorems."
    likely_misfire: "Surface-level abstraction that leaves concrete execution bookkeeping as the actual rule or semantic authority."
    blind_spots_considered:
      - "Bound-wire equivalence, ordered boundaries, aliases, freshness, and capture avoidance"
      - "Direct relational treatment of global and simultaneous rules"
      - "Representation existence and uniqueness modulo recursive diagram isomorphism"
      - "Open-state execution, representation completeness, one-step execution completeness, and domain-invalid rejection"
    existing_plan_facts:
      - "Recursive open diagrams and structural denotation are authoritative."
      - "Occurrence is context decomposition modulo recursive diagram isomorphism."
      - "Local rules use contextual closure; global and simultaneous rules use direct relations."
      - "Step.sound is exhaustive and independent of concrete execution artifacts."
      - "Concrete representation, execution, and rejection claims refine recursive relations."
      - "The Lean formalization contains no matcher or occurrence-search subsystem."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: ready
    url: "http://goalbuddy.localhost:41737/recursive-rewrite-authority/"
    command: "node /home/ahart/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/recursive-rewrite-authority"

