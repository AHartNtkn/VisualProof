    constraints:
      - "TypeScript is outside the goal."
      - "Use independent subagents to audit rule interfaces, refinement interfaces, and task dependency order."
      - "Write docs/superpowers/plans/2026-08-06-recursive-rewrite-authority.md with exact acceptance signatures, RED/GREEN theorems, verification commands, migration order, and commit boundaries."
