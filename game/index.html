<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchard</title>
  </head>
  <body>
    <main
      class="game"
      data-game
      data-ready="false"
      data-camera-mode="menu"
      aria-label="Orchard"
    >
      <div class="world" data-world aria-hidden="true"></div>
      <div class="reticle" data-reticle hidden aria-hidden="true"></div>
      <p class="engage" data-engage hidden>Click to play</p>

      <section class="start" data-start aria-labelledby="orchard-title">
        <p class="eyebrow">Visual Proof Assistant</p>
        <h1 id="orchard-title">Orchard</h1>
        <p class="introduction">View saved proof-tree orchards.</p>

        <form class="create" data-create-form>
          <label for="orchard-name">New orchard</label>
          <div class="create-row">
            <input id="orchard-name" name="name" value="My Orchard" maxlength="80" required data-new-slot-name>
            <button type="submit" data-create-slot>Create</button>
          </div>
        </form>

        <div class="slots" aria-labelledby="saved-heading">
          <h2 id="saved-heading">Saved orchards</h2>
          <p class="slot-loading" data-slot-loading>Reading save slots…</p>
          <ul data-slot-list></ul>
        </div>
        <p class="menu-error" data-menu-error role="alert"></p>
      </section>

      <aside class="tutorial-card" data-tutorial-card hidden aria-live="polite"></aside>

      <section class="status-hud" data-hud data-status-hud hidden aria-live="polite">
        <div class="status-hud-row">
          <strong data-world-name>Orchard</strong>
          <span class="save-status" data-save-status>Saved</span>
          <button class="retry" data-save-retry type="button" hidden>Retry save</button>
        </div>
        <p class="feedback" data-feedback role="status"></p>
      </section>

      <section class="tool-selector" data-tool-selector aria-live="polite"></section>

      <section class="held-tool-model" data-held-tool-model hidden aria-hidden="true">
        <span
          class="held-tool-silhouette tool-silhouette"
          data-held-tool-silhouette
          data-silhouette="sprout"
        ></span>
      </section>

      <section class="ledger" data-ledger hidden aria-label="Ledger">
        <nav class="ledger-primary-tabs" data-ledger-primary-tabs aria-label="Ledger section"></nav>
        <nav class="ledger-context-tabs" data-ledger-context-tabs aria-label="Ledger view"></nav>
        <div class="ledger-content" data-ledger-content></div>
      </section>

      <section
        class="pause"
        data-pause
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="pause-title"
      >
        <p class="eyebrow">Orchard</p>
        <h2 id="pause-title">Paused</h2>
        <p class="pause-world" data-pause-world-name></p>
        <div class="pause-actions">
          <button type="button" data-pause-resume>Resume</button>
          <button type="button" data-pause-main-menu>Main Menu</button>
          <button type="button" data-pause-quit>Quit Game</button>
        </div>
        <p class="pause-error" data-pause-error role="alert"></p>
      </section>

    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
