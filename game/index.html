<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchard</title>
  </head>
  <body>
    <main
      class="game"
      data-game
      data-ready="false"
      data-camera-mode="menu"
      aria-label="Orchard"
    >
      <div class="world" data-world aria-hidden="true"></div>

      <section class="start" data-start aria-labelledby="orchard-title">
        <p class="eyebrow">Visual Proof Assistant</p>
        <h1 id="orchard-title">Orchard</h1>
        <p class="introduction">View saved proof-tree orchards.</p>

        <form class="create" data-create-form>
          <label for="orchard-name">New orchard</label>
          <div class="create-row">
            <input id="orchard-name" name="name" value="My Orchard" maxlength="80" required data-new-slot-name>
            <button type="submit" data-create-slot>Create</button>
          </div>
        </form>

        <div class="slots" aria-labelledby="saved-heading">
          <h2 id="saved-heading">Saved orchards</h2>
          <p class="slot-loading" data-slot-loading>Reading save slots…</p>
          <ul data-slot-list></ul>
        </div>
        <p class="menu-error" data-menu-error role="alert"></p>
      </section>

      <aside class="hud" data-hud hidden aria-live="polite">
        <div class="hud-row">
          <strong data-world-name>Orchard</strong>
          <span class="save-status" data-save-status>Saved</span>
          <button class="retry" data-save-retry type="button" hidden>Retry save</button>
        </div>
        <p class="feedback" data-feedback role="status"></p>
      </aside>

    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
