[package]
name = "orchard-game"
version = "0.1.0"
description = "Orchard desktop game shell"
authors = ["Visual Proof Assistant"]
edition = "2021"

[lib]
name = "orchard_game"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
